query GetProfile {
    me {
        id
        email
        avatarUrl
        profile {
            fullName
            gender
            age
            bio
        }
        measurement {
            heightCm
            weightKg
            goalWeightKg
            chestCm
            waistCm
            thighCm
            armCm
            activityLevel
            nutritionGoal
        }
    }
}